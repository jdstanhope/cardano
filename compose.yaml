name: cardano

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cardano
      POSTGRES_PASSWORD: password
    volumes:
      # postgres:18 sets PGDATA to /var/lib/postgresql/18/docker and declares its
      # volume one level up, so the whole directory is what needs to persist.
      - postgres-data:/var/lib/postgresql
    ports:
      # Bound to loopback so the database isn't reachable from the local network.
      # Drop this line if 5432 is already taken on the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardano"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails server
    environment:
      DB_HOST: postgres
      DB_USERNAME: cardano
      DB_PASSWORD: password
      # Tells ApplicationSystemTestCase to drive the browser in the selenium service.
      # Unset elsewhere, so GitHub Actions keeps using its own local Chrome.
      SELENIUM_REMOTE_URL: http://selenium:4444
    ports:
      # Loopback-only: development exposes web-console, an interactive REPL on error
      # pages, which must never be reachable from the local network.
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/rails
      # Gems live in a volume so they survive `docker compose down` and are not
      # clobbered by the bind mount above.
      - bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
    # Keeps `debugger` / `binding.irb` usable via `docker compose attach app`.
    stdin_open: true
    tty: true

  # The Tailwind watcher runs as its own service rather than beside Puma under
  # foreman, which tears down the whole formation when any one process exits. A
  # git checkout rewrites files under the bind mount, the watcher notices and
  # exits, and that used to stop the web server too. Isolated here it can restart
  # on its own without touching Puma. Auto-restart is safe for a stateless
  # watcher; it is deliberately not set on `app`, where it would mask a crash loop.
  css:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # `always` passes --watch=always to the Tailwind CLI. Without it the watcher exits
    # as soon as stdin closes, which it does when nothing holds a TTY open. Under
    # foreman that never showed, because foreman supplied one.
    command: [ "bin/rails", "tailwindcss:watch[always]" ]
    environment:
      DB_HOST: postgres
      DB_USERNAME: cardano
      DB_PASSWORD: password
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # A real browser for system tests. The app container has none, so `bin/rails
  # test:system` could not run locally at all before this.
  selenium:
    image: selenium/standalone-chromium:latest
    # Chromium crashes on the default 64MB of shared memory.
    shm_size: 2gb
    ports:
      # noVNC, for watching a test run: http://localhost:7900 (password "secret").
      - "127.0.0.1:7900:7900"

volumes:
  postgres-data:
  bundle:
